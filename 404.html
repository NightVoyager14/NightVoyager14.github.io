<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面走丢了 · NightVoyager</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.ico">
    <style>
        :root { color-scheme: light dark; }
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 2rem 1.25rem;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            color: #3a3228;
            background: #f8f4ee;
        }
        .code {
            font-size: clamp(3rem, 14vw, 6rem);
            font-weight: 700;
            line-height: 1;
            color: #c8946a;
            letter-spacing: 0.05em;
        }
        p { margin: 0.25rem 0; color: #a09080; }
        .links { margin-top: 1.5rem; display: flex; gap: 1.25rem; flex-wrap: wrap; justify-content: center; }
        a {
            color: #c8946a;
            text-decoration: none;
            padding: 0.5rem 1.25rem;
            border: 1.5px solid #e8e0d8;
            border-radius: 999px;
            font-size: 0.9rem;
            transition: border-color 0.25s ease, color 0.25s ease;
        }
        a:hover { border-color: #c8946a; }
        :focus-visible { outline: 2px solid #c8946a; outline-offset: 2px; }
        @media (prefers-color-scheme: dark) {
            body { color: #e8e0d8; background: #1c1814; }
            .code { color: #d4a880; }
            p { color: #a09088; }
            a { color: #d4a880; border-color: #3a342e; }
            a:hover { border-color: #d4a880; }
            :focus-visible { outline-color: #d4a880; }
        }
    </style>
</head>
<body>
    <div class="code">404</div>
    <h1>这里什么也没有</h1>
    <p>你要找的页面不存在，或者已经被移动了。</p>
    <div class="links">
        <a href="/">返回首页</a>
        <a href="/gaokao/">去看高考倒计时</a>
    </div>
</body>
</html>
