<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>四川高考倒计时 · 3+1+2</title>
    <meta name="theme-color" content="#c8946a" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1814" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="高考倒计时">
    <meta name="application-name" content="高考倒计时">
    <meta name="description" content="四川 3+1+2 新高考倒计时与日程安排，支持选科标记、深色模式">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='32' fill='%23c8946a'/%3E%3Ctext x='96' y='126' text-anchor='middle' font-size='100' font-weight='700' font-family='sans-serif' fill='white'%3E考%3C/text%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ===== 主题变量 ===== */
        :root {
            --bg: #f8f4ee;
            --bg-card: #ffffff;
            --bg-card-hover: #fdfaf6;
            --bg-card-selected: #fdf9f4;
            --bg-hero: #ffffff;
            --bg-soft: #f0e8e0;
            --bg-tag-mandatory: #f0e8e0;
            --bg-tag-elective: #e8ece4;
            --bg-tag-special: #f0e8e0;
            --bg-tag-selected: #c8946a;
            --bg-selector: #ffffff;
            --bg-selector-option: #faf5f0;
            --bg-overlay: #f8f4ee;
            --bg-fs-next: #ffffff;

            --text-primary: #3a3228;
            --text-secondary: #a09080;
            --text-muted: #c0b0a0;
            --text-light: #d8d0c8;
            --text-on-accent: #ffffff;
            --text-accent: #c8946a;
            --text-elective: #7a9a7a;
            --text-special: #b08070;
            --text-tag-mandatory: #c8946a;
            --text-tag-elective: #7a9a7a;
            --text-tag-special: #b08070;
            --text-tag-dimmed: #d0c8c0;
            --text-hero: #c8946a;

            --border: #e8e0d8;
            --border-card: #e8e0d8;
            --border-card-hover: #dcd0c8;
            --border-card-selected: #dcc8b8;
            --border-selector: #e8e0d8;
            --border-selector-option: #e8e0d8;
            --border-selector-active: #c8946a;

            --shadow-sm: 0 1px 4px rgba(0,0,0,0.04);
            --shadow-md: 0 2px 12px rgba(0,0,0,0.05);
            --shadow-lg: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-btn: 0 4px 16px rgba(200,148,106,0.3);
            --shadow-btn-hover: 0 6px 20px rgba(200,148,106,0.4);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 999px;

            --transition: 0.25s ease;
        }

        [data-theme="dark"] {
            --bg: #1c1814;
            --bg-card: #2a2420;
            --bg-card-hover: #322c26;
            --bg-card-selected: #322c26;
            --bg-hero: #2a2420;
            --bg-soft: #322c26;
            --bg-tag-mandatory: #3d3228;
            --bg-tag-elective: #283028;
            --bg-tag-special: #3d3028;
            --bg-tag-selected: #d4a880;
            --bg-selector: #2a2420;
            --bg-selector-option: #322c26;
            --bg-overlay: #1c1814;
            --bg-fs-next: #2a2420;

            --text-primary: #e8e0d8;
            --text-secondary: #a09088;
            --text-muted: #706860;
            --text-light: #5a5248;
            --text-on-accent: #ffffff;
            --text-accent: #d4a880;
            --text-elective: #8aaa8a;
            --text-special: #c09078;
            --text-tag-mandatory: #d4a880;
            --text-tag-elective: #8aaa8a;
            --text-tag-special: #c09078;
            --text-tag-dimmed: #5a5248;
            --text-hero: #d4a880;

            --border: #3a342e;
            --border-card: #3a342e;
            --border-card-hover: #4a443e;
            --border-card-selected: #4a3e32;
            --border-selector: #3a342e;
            --border-selector-option: #3a342e;
            --border-selector-active: #d4a880;

            --shadow-sm: 0 1px 4px rgba(0,0,0,0.2);
            --shadow-md: 0 2px 12px rgba(0,0,0,0.25);
            --shadow-lg: 0 4px 16px rgba(0,0,0,0.3);
            --shadow-btn: 0 4px 16px rgba(212,168,128,0.25);
            --shadow-btn-hover: 0 6px 20px rgba(212,168,128,0.35);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 16px;
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-accent);
            letter-spacing: 4px;
        }

        .header .sub {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
            color: var(--text-secondary);
            font-size: 0.82rem;
            letter-spacing: 1px;
        }

        .header .sub .badge {
            background: var(--text-accent);
            padding: 2px 14px;
            border-radius: var(--radius-full);
            font-size: 0.72rem;
            color: var(--text-on-accent);
            font-weight: 500;
        }

        /* ===== 总体倒计时 ===== */
        .hero-countdown {
            background: var(--bg-hero);
            border-radius: var(--radius-lg);
            padding: 22px 20px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            transition: background var(--transition), border var(--transition);
        }

        .hero-countdown .label {
            color: var(--text-secondary);
            font-size: 0.78rem;
            letter-spacing: 2px;
            margin-bottom: 14px;
            font-weight: 500;
        }

        .hero-countdown .timer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
        }

        .hero-countdown .timer .num {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-hero);
            background: var(--bg-soft);
            border-radius: var(--radius-sm);
            padding: 4px 10px;
            min-width: 50px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            line-height: 1.3;
            transition: background var(--transition), color var(--transition);
        }

        .hero-countdown .timer .sep {
            font-size: 1.8rem;
            font-weight: 300;
            color: var(--text-light);
            padding-bottom: 4px;
        }

        .hero-countdown .timer .unit {
            font-size: 0.62rem;
            color: var(--text-muted);
            display: block;
            margin-top: 2px;
        }

        .hero-countdown.ongoing .timer .num {
            background: var(--bg-soft);
            animation: pulseSoft 1.5s ease-in-out infinite;
        }

        @keyframes pulseSoft {
            0%,100% { box-shadow: 0 0 8px rgba(200,148,106,0.08); }
            50% { box-shadow: 0 0 20px rgba(200,148,106,0.18); }
        }

        .status-msg {
            color: var(--text-accent);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 3px;
            display: none;
            margin-bottom: 16px;
            text-align: center;
        }
        .status-msg.show { display: block; animation: fadeUp 0.4s ease; }

        /* ===== 当前考试进程 ===== */
        .current-exam {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 18px 22px;
            margin-bottom: 20px;
            display: none;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            animation: fadeUp 0.4s ease;
            transition: border-color 0.3s, background var(--transition);
        }
        .current-exam.ce-waiting {
            border-color: #c8a870;
        }
        .current-exam.show { display: block; }

        .current-exam .ce-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .current-exam .ce-header .ce-label {
            color: var(--text-secondary);
            font-size: 0.7rem;
            letter-spacing: 2px;
            font-weight: 500;
        }

        .current-exam .ce-header .ce-status-badge {
            font-size: 0.62rem;
            padding: 2px 12px;
            border-radius: var(--radius-full);
            font-weight: 500;
        }
        .ce-status-badge.ce-ongoing {
            background: var(--bg-soft);
            color: var(--text-accent);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .ce-status-badge.ce-ongoing::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--text-accent);
            animation: pulseDot 1.2s ease-in-out infinite;
        }
        .ce-status-badge.ce-upcoming {
            background: #f0ece4;
            color: #b89860;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        [data-theme="dark"] .ce-status-badge.ce-upcoming {
            background: #322c24;
            color: #c8a870;
        }
        .ce-status-badge.ce-upcoming::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #b89860;
        }
        [data-theme="dark"] .ce-status-badge.ce-upcoming::before {
            background: #c8a870;
        }
        .ce-status-badge.ce-done {
            background: #eaf2ea;
            color: #689868;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        [data-theme="dark"] .ce-status-badge.ce-done {
            background: #283828;
            color: #78b078;
        }
        .ce-status-badge.ce-done::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #689868;
        }
        [data-theme="dark"] .ce-status-badge.ce-done::before {
            background: #78b078;
        }

        .current-exam .ce-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .current-exam .ce-body .ce-name {
            color: var(--text-primary);
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .current-exam .ce-body .ce-time {
            color: var(--text-secondary);
            font-size: 0.78rem;
        }

        .current-exam .ce-body .ce-countdown-num {
            color: var(--text-accent);
            font-size: 1.2rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .ce-progress-wrap { width: 100%; margin-top: 12px; }
        .ce-progress-bar {
            width: 100%; height: 4px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }
        .ce-progress-bar .ce-progress-fill {
            height: 100%; border-radius: 4px;
            background: linear-gradient(90deg, var(--text-accent), #e8a098);
            transition: width 0.5s ease;
            width: 0%;
        }
        .ce-progress-wrap .ce-progress-label {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.58rem;
            margin-top: 4px;
        }

        /* ===== 选科标记 ===== */
        .subject-selector {
            background: var(--bg-selector);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            margin-bottom: 18px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-selector);
            transition: background var(--transition), border var(--transition);
        }
        .ss-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .ss-header .ss-title {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 2px;
        }
        .ss-header .ss-hint {
            font-size: 0.58rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }
        .ss-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .ss-row:last-child {
            margin-bottom: 0;
        }
        .ss-row .ss-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            font-weight: 500;
            min-width: 4em;
            flex-shrink: 0;
        }
        .ss-option {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 5px 18px;
            border-radius: var(--radius-full);
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            border: 1.5px solid var(--border-selector-option);
            background: var(--bg-selector-option);
            color: var(--text-secondary);
            transition: all var(--transition);
            user-select: none;
            -webkit-user-select: none;
            letter-spacing: 1px;
        }
        .ss-option:hover {
            border-color: var(--text-muted);
        }
        .ss-option.active {
            border-color: var(--border-selector-active);
            background: var(--bg-soft);
            color: var(--text-accent);
        }

        /* -- 卡片高亮状态 -- */
        .exam-card.subject-selected {
            background: var(--bg-card-selected);
            border-color: var(--border-card-selected);
        }
        .exam-card.subject-selected .tag-elective {
            background: var(--bg-tag-selected);
            color: var(--text-on-accent);
        }
        .exam-card.subject-selected .sel-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            color: var(--text-elective);
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .exam-card.subject-selected .sel-badge::before {
            content: '';
            width: 4px; height: 4px;
            border-radius: 50%;
            background: var(--text-elective);
            flex-shrink: 0;
        }

        .exam-card.subject-dimmed {
            opacity: 0.35;
            transition: opacity var(--transition);
        }
        .exam-card.subject-dimmed:hover {
            opacity: 0.5;
        }
        .exam-card.subject-dimmed .tag-elective {
            background: transparent;
            border: 1px solid var(--text-tag-dimmed);
            color: var(--text-tag-dimmed);
        }
        .exam-card.subject-dimmed .sel-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            color: var(--text-tag-dimmed);
            font-size: 0.6rem;
            font-weight: 500;
        }
        .exam-card.subject-dimmed .sel-badge::before {
            content: '';
            width: 4px; height: 4px;
            border-radius: 50%;
            border: 1px solid var(--text-tag-dimmed);
            background: transparent;
            flex-shrink: 0;
        }

        .exam-card .sel-badge { display: none; }
        .exam-card.exam-done .sel-badge { display: none !important; }

        /* ===== 日程标题 ===== */
        .section-title {
            color: #888;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 14px;
            text-align: center;
        }

        /* ===== 日期组 ===== */
        .day-group { margin-bottom: 18px; }

        .day-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .day-header .day-num {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-accent);
            background: var(--bg-soft);
            padding: 2px 10px;
            border-radius: var(--radius-sm);
        }

        .day-header .day-date {
            color: var(--text-muted);
            font-size: 0.78rem;
            letter-spacing: 1px;
        }

        /* ===== 上下午分隔 ===== */
        .session-divider {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0 6px;
            padding-left: 2px;
        }
        .session-divider .line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .session-divider .label {
            font-size: 0.68rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            font-weight: 500;
            white-space: nowrap;
        }

        /* ===== 考试卡片 ===== */
        .exam-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            margin-bottom: 6px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 12px;
            transition: all var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .exam-card:hover {
            border-color: var(--border-card-hover);
            background: var(--bg-card-hover);
            box-shadow: var(--shadow-md);
        }

        .exam-card .name {
            color: var(--text-primary);
            font-size: 0.92rem;
            font-weight: 600;
            min-width: 64px;
            letter-spacing: 1px;
            transition: color var(--transition);
        }

        .exam-card .meta {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            flex: 1;
        }

        .exam-card .meta .time-range {
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 500;
        }

        .exam-card .meta .tag {
            font-size: 0.6rem;
            padding: 2px 10px;
            border-radius: var(--radius-full);
            font-weight: 500;
            transition: all var(--transition);
        }
        .tag-mandatory { background: var(--bg-tag-mandatory); color: var(--text-tag-mandatory); }
        .tag-elective { background: var(--bg-tag-elective); color: var(--text-tag-elective); }
        .tag-special { background: var(--bg-tag-special); color: var(--text-tag-special); }

        .exam-card .countdown-mini {
            display: flex;
            align-items: center;
            gap: 3px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .exam-card .countdown-mini .cd-num {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            min-width: 18px;
            text-align: center;
            transition: color var(--transition);
        }

        .exam-card .countdown-mini .cd-unit {
            font-size: 0.58rem;
            color: var(--text-muted);
        }

        .exam-card .countdown-mini .cd-sep {
            color: var(--text-light);
            font-weight: 400;
        }

        .exam-card.exam-done {
            opacity: 0.5;
        }
        .exam-card.exam-done .countdown-mini .cd-num,
        .exam-card.exam-done .countdown-mini .cd-unit,
        .exam-card.exam-done .countdown-mini .cd-sep {
            display: none;
        }
        .exam-done-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 0.62rem;
            color: #689868;
            font-weight: 500;
            letter-spacing: 1px;
        }
        [data-theme="dark"] .exam-done-badge { color: #78b078; }
        .exam-done-badge::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #689868;
        }
        [data-theme="dark"] .exam-done-badge::before { background: #78b078; }

        .exam-card.exam-now {
            border-color: var(--text-accent);
            background: var(--bg-card-selected);
        }
        .exam-card.exam-now .countdown-mini .cd-num { color: var(--text-accent); }
        .exam-card.exam-now .name { color: var(--text-accent); }

        .exam-card.exam-now .exam-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 0.58rem;
            padding: 1px 10px;
            border-radius: var(--radius-full);
            background: var(--bg-soft);
            color: var(--text-accent);
            margin-left: 6px;
            font-weight: 500;
        }
        .exam-card.exam-now .exam-badge::before {
            content: '';
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--text-accent);
            animation: pulseDot 1.2s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%,100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .cd-legend {
            text-align: center;
            color: var(--text-light);
            font-size: 0.58rem;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }

        .footer {
            text-align: center;
            color: var(--text-accent);
            font-size: 0.82rem;
            padding: 18px 0 6px;
            border-top: 1px solid var(--border);
            letter-spacing: 2px;
            font-weight: 500;
            transition: color var(--transition), border var(--transition);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container { animation: fadeUp 0.4s ease; }

        /* ===== 底部操作按钮 ===== */
        .action-bar {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 100;
            display: flex;
            gap: 10px;
        }
        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            background: var(--text-accent);
            color: var(--text-on-accent);
            border: none;
            border-radius: var(--radius-md);
            padding: 10px 18px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: var(--shadow-btn);
            transition: all var(--transition);
            font-family: inherit;
            line-height: 1;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-btn-hover); }
        .action-btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }
        .action-btn-secondary:hover {
            background: var(--bg-card-hover);
            box-shadow: var(--shadow-lg);
        }

        /* ===== 全屏覆盖层 ===== */
        .fs-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg-overlay);
            color: var(--text-primary);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            transition: background var(--transition);
        }
        .fs-overlay.open { display: block; }

        .fs-exit {
            position: absolute;
            top: 20px;
            right: 24px;
            z-index: 10;
            background: var(--text-accent);
            color: var(--text-on-accent);
            border: none;
            border-radius: var(--radius-sm);
            padding: 6px 16px;
            font-size: 0.78rem;
            cursor: pointer;
            letter-spacing: 1px;
            font-weight: 500;
            transition: all var(--transition);
            box-shadow: var(--shadow-btn);
            font-family: inherit;
        }
        .fs-exit:hover { transform: translateY(-1px); box-shadow: var(--shadow-btn-hover); }

        .fs-inner {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            padding: 28px 6vw;
            text-align: center;
            animation: fadeUp 0.4s ease;
        }

        .fs-header {
            font-size: 0.85rem;
            color: var(--text-secondary);
            letter-spacing: 4px;
            margin-bottom: 1.2vh;
            font-weight: 500;
            flex-shrink: 0;
        }

        /* -- 状态条 -- */
        .fs-status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 2vh;
            flex-shrink: 0;
        }
        .fs-status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-accent);
            animation: pulseDot 1.2s ease-in-out infinite;
            transition: background var(--transition);
        }
        .fs-status-text {
            font-size: 0.78rem;
            letter-spacing: 3px;
            font-weight: 500;
            transition: color var(--transition);
        }
        .fs-status-bar.status-waiting .fs-status-dot {
            background: #c8a870;
            animation: none;
        }
        .fs-status-bar.status-waiting .fs-status-text { color: #c8a870; }
        .fs-status-bar.status-ongoing .fs-status-dot { background: var(--text-accent); }
        .fs-status-bar.status-ongoing .fs-status-text { color: var(--text-accent); }
        .fs-status-bar.status-done .fs-status-dot {
            background: #78b078;
            animation: none;
        }
        .fs-status-bar.status-done .fs-status-text { color: #78b078; }

        /* -- 主体区域（flex 撑满） -- */
        .fs-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        .fs-current-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            letter-spacing: 4px;
            margin-bottom: 1.2vh;
            font-weight: 500;
        }

        .fs-current-name {
            font-size: clamp(2rem, 6vh, 4rem);
            font-weight: 700;
            color: var(--text-hero);
            letter-spacing: 0.12em;
            margin-bottom: 0.3vh;
            line-height: 1.2;
            transition: color var(--transition);
        }

        .fs-current-time {
            font-size: clamp(0.85rem, 1.6vh, 1.1rem);
            color: var(--text-muted);
            letter-spacing: 3px;
            margin-bottom: 2vh;
        }

        /* -- 等待考试时的配色 -- */
        .fs-state-waiting .fs-current-name { color: #c8a870; }
        .fs-state-waiting .fs-timer-digits .digit-block .num { color: #c8a870; }
        .fs-state-waiting .fs-progress-fill {
            background: linear-gradient(90deg, #d4b888, #c8a870);
        }
        .fs-state-waiting .fs-next-countdown { color: var(--text-accent); }

        /* -- 计时器数字块（填充横向空间） -- */
        .fs-timer-wrap {
            width: 100%;
            max-width: 860px;
            margin-bottom: 2.5vh;
        }

        .fs-timer-digits {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.4vw;
        }

        .fs-timer-digits .digit-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 0;
        }

        .fs-timer-digits .digit-block .num {
            font-size: clamp(2.8rem, 11vh, 7rem);
            font-weight: 700;
            color: var(--text-hero);
            font-variant-numeric: tabular-nums;
            line-height: 1;
            letter-spacing: 0;
            transition: color var(--transition);
        }

        .fs-timer-digits .digit-block .label {
            font-size: 0.62rem;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .fs-timer-digits .digit-sep {
            font-size: clamp(2rem, 8vh, 5rem);
            font-weight: 200;
            color: var(--text-light);
            flex-shrink: 0;
            width: 0.4em;
            text-align: center;
            line-height: 1;
            align-self: center;
            transition: color var(--transition);
        }

        /* -- 进度条（全宽） -- */
        .fs-progress-wrap {
            width: 100%;
            max-width: 860px;
            margin-bottom: 2.5vh;
        }
        .fs-progress-bar {
            width: 100%; height: 4px;
            background: var(--border);
            border-radius: 4px;

        }
        .fs-progress-fill {

        .exam-card:nth-child(2) { animation-delay: 0.04s; }
        .exam-card:nth-child(3) { animation-delay: 0.06s; }
        .exam-card:nth-child(4) { animation-delay: 0.08s; }
        .exam-card:nth-child(5) { animation-delay: 0.10s; }
        .exam-card:nth-child(6) { animation-delay: 0.12s; }
        .exam-card:nth-child(7) { animation-delay: 0.14s; }
        .exam-card:nth-child(8) { animation-delay: 0.16s; }
        .exam-card:nth-child(9) { animation-delay: 0.18s; }
        .exam-card:nth-child(10) { animation-delay: 0.20s; }

        @media (max-width: 600px) {
            body { padding: 16px 10px; }
            .header h1 { font-size: 1.5rem; letter-spacing: 2px; }
            .hero-countdown { padding: 16px 14px; }
            .hero-countdown .timer .num { font-size: 1.5rem; min-width: 40px; padding: 3px 8px; }
            .hero-countdown .timer .sep { font-size: 1.3rem; }
            .current-exam { padding: 14px 16px; }
            .current-exam .ce-body .ce-name { font-size: 1rem; }
            .current-exam .ce-body .ce-countdown-num { font-size: 1.05rem; }
            .exam-card { padding: 10px 12px; gap: 4px; }
            .exam-card .name { font-size: 0.85rem; min-width: 50px; }
            .exam-card .countdown-mini { margin-left: 0; width: 100%; justify-content: flex-end; }
            .exam-card .meta .time-range { font-size: 0.7rem; }
            .session-divider { margin: 8px 0 4px; }
            .session-divider .label { font-size: 0.62rem; }
            .fs-current-name { font-size: clamp(1.5rem, 5vh, 2.2rem); letter-spacing: 0.08em; }
            .fs-timer-digits .digit-block .num { font-size: clamp(1.8rem, 7vh, 3rem); }
            .fs-timer-digits .digit-sep { font-size: clamp(1.2rem, 5vh, 2rem); }
            .fs-inner { padding: 20px 5vw; }
            .fs-header { font-size: 0.72rem; }
            .fs-next { gap: 6px; padding: 8px 14px; font-size: 0.78rem; }
            .fs-next-name { font-size: 0.82rem; }
            .fs-summary { gap: 10vw; font-size: 0.68rem; }
            .action-bar { bottom: 16px; right: 16px; gap: 8px; }
            .action-btn { padding: 8px 14px; font-size: 0.75rem; border-radius: var(--radius-sm); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 头部 -->
    <div class="header">
        <h1>四川高考倒计时</h1>
        <div class="sub">
            <span>3+1+2 新高考 · <strong style="color:#dc3545;">四川</strong></span>
            <span class="badge" id="yearBadge">2026</span>
        </div>
    </div>

    <!-- 状态横幅 -->
    <div class="status-msg" id="statusMsg">高考进行中 · 沉着冷静</div>

    <!-- 总体倒计时 -->
    <div class="hero-countdown" id="heroSection">
        <div class="label" id="heroLabel">距高考还有</div>
        <div class="timer" id="heroTimer">
            <div><span class="num" id="hDays">--</span><span class="unit">天</span></div>
            <span class="sep">:</span>
            <div><span class="num" id="hHours">--</span><span class="unit">时</span></div>
            <span class="sep">:</span>
            <div><span class="num" id="hMins">--</span><span class="unit">分</span></div>
            <span class="sep">:</span>
            <div><span class="num" id="hSecs">--</span><span class="unit">秒</span></div>
        </div>
    </div>

    <!-- 当前考试进程 -->
    <div class="current-exam" id="currentExam">
        <div class="ce-header">
            <span class="ce-label" id="ceLabel">当前考试</span>
            <span class="ce-status-badge ce-ongoing" id="ceBadge">进行中</span>
        </div>
        <div class="ce-body">
            <span class="ce-name" id="ceName">—</span>
            <span class="ce-time" id="ceTime">—</span>
            <span class="ce-countdown-num" id="ceCountdown">--:--:--</span>
        </div>
        <div class="ce-progress-wrap">
            <div class="ce-progress-bar">
                <div class="ce-progress-fill" id="ceProgressFill"></div>
            </div>
            <div class="ce-progress-label">
                <span id="ceProgressStart">开始</span>

            </div>
        </div>
    </div>

    <!-- 选科标记 -->
    <div class="subject-selector" id="subjectSelector">
        <div class="ss-header">
            <span class="ss-title">我的选科</span>
            <span class="ss-hint">点击标记</span>
        </div>
        <div class="ss-row">
            <span class="ss-label">首选</span>
            <span class="ss-option" data-subject="历史">历史</span>
            <span class="ss-option" data-subject="物理">物理</span>
        </div>
        <div class="ss-row">
            <span class="ss-label">再选</span>
            <span class="ss-option" data-subject="化学">化学</span>
            <span class="ss-option" data-subject="地理">地理</span>
            <span class="ss-option" data-subject="思想政治">思想政治</span>

    <!-- 日程标题 -->

    <!-- 日程容器 -->

    <!-- 底部 -->

    <!-- 底部操作栏 -->
    <div class="action-bar">
        <button class="action-btn action-btn-secondary" id="themeToggle" title="切换主题">浅色</button>
        <button class="action-btn action-btn-secondary" id="pipToggle" title="浮动小窗">小窗</button>
        <button class="action-btn action-btn-secondary" id="installBtn" title="安装到桌面" style="display:none;">安装</button>
        <button class="action-btn" id="fsToggle" title="全屏显示">全屏</button>
    </div>

    <!-- ===== 全屏显示覆盖层 ===== -->
    <div class="fs-overlay" id="fsOverlay">
        <button class="fs-exit" id="fsExit" title="退出全屏">✕ 退出</button>
        <div class="fs-inner">
            <div class="fs-header">四川高考倒计时 · 3+1+2</div>

            <div class="fs-status-bar" id="fsStatusBar">
                <span class="fs-status-dot" id="fsStatusDot"></span>
                <span class="fs-status-text" id="fsStatusText">正在进行</span>
            </div>

            <div class="fs-main">
                <div class="fs-current-label" id="fsCurLabel">当前考试</div>
                <div class="fs-current-name" id="fsCurName">—</div>
                <div class="fs-current-time" id="fsCurTime">--:--</div>

                <div class="fs-timer-wrap">
                    <div class="fs-timer-digits" id="fsTimerDigits">
                        <div class="digit-block"><span class="num" id="fsDd">00</span><span class="label">天</span></div>
                        <span class="digit-sep">·</span>
                        <div class="digit-block"><span class="num" id="fsDh">00</span><span class="label">时</span></div>
                        <span class="digit-sep">:</span>
                        <div class="digit-block"><span class="num" id="fsDm">00</span><span class="label">分</span></div>
                        <span class="digit-sep">:</span>
                        <div class="digit-block"><span class="num" id="fsDs">00</span><span class="label">秒</span></div>
                    </div>
                </div>

                <div class="fs-progress-wrap">
                    <div class="fs-progress-bar"><div class="fs-progress-fill" id="fsProgressFill"></div></div>
                    <div class="fs-progress-label">
                        <span id="fsProgStart">开始</span>
                        <span id="fsProgEnd">剩余 --:--:--</span>
                    </div>
                </div>

                <div class="fs-next" id="fsNext">
                    <span class="fs-next-label">下一场</span>
                    <span class="fs-next-name" id="fsNextName">—</span>
                    <span class="fs-next-time" id="fsNextTime">--:-- ~ --:--</span>
                    <span class="fs-next-countdown" id="fsNextCountdown">--:--:--</span>
                </div>
            </div>

            <div class="fs-summary" id="fsSummary">
                <span>已完成 <strong id="fsDone">0</strong> 场</span>
                <span>剩余 <strong id="fsRemain">0</strong> 场 <span class="fs-total-hint" id="fsTotalHint"></span></span>
            </div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    //  四川 3+1+2 新高考 · 考试数据
    // ============================================================

    const GAOKAO_YEAR = (() => {
        const now = new Date();
        const y = now.getFullYear();
        const end = new Date(y, 5, 10, 11, 0, 0);
        return now > end ? y + 1 : y;
    })();

    // 考试配置
    const exams = [
        // 6月7日
        { date: 7, start: [9,0],  end: [11,30], name: '语文',         tag: 'mandatory' },
        { date: 7, start: [15,0], end: [17,0],  name: '数学',         tag: 'mandatory' },
        // 6月8日
        { date: 8, start: [9,0],  end: [10,15], name: '历史 / 物理',  tag: 'elective' },
        { date: 8, start: [15,0], end: [17,0],  name: '外语',         tag: 'mandatory' },
        // 6月9日
        { date: 9, start: [8,30], end: [9,45],  name: '化学',         tag: 'elective' },
        { date: 9, start: [11,0], end: [12,15], name: '地理',         tag: 'elective' },
        { date: 9, start: [14,30],end: [15,45], name: '思想政治',     tag: 'elective' },
        { date: 9, start: [17,0], end: [18,15], name: '生物学',       tag: 'elective' },
        // 6月10日
        { date: 10, start: [9,0], end: [11,0],  name: '藏语文 / 彝语文', tag: 'special' },
    ];

    const tagLabels = { mandatory: '全国统考', elective: '等级选考', special: '民族加试' };
    const tagClasses = { mandatory: 'tag-mandatory', elective: 'tag-elective', special: 'tag-special' };
    const weekDays = ['日', '一', '二', '三', '四', '五', '六'];

    function getWeekDay(date) {
        const d = new Date(GAOKAO_YEAR, 5, date);
        return '周' + weekDays[d.getDay()];
    }

    const dateLabels = {};
    [7, 8, 9, 10].forEach(d => { dateLabels[d] = `6月${d}日 · ${getWeekDay(d)}`; });

    // 为每科生成 Date 对象
    function getExamStart(e) {
        return new Date(GAOKAO_YEAR, 5, e.date, e.start[0], e.start[1], 0);
    }
    function getExamEnd(e) {
        return new Date(GAOKAO_YEAR, 5, e.date, e.end[0], e.end[1], 0);
    }

    // ============================================================
    //  选科标记
    // ============================================================

    const SUBJECTS = {
        primary: { label: '首选', options: ['历史', '物理'], max: 1 },
        secondary: { label: '再选', options: ['化学', '地理', '思想政治', '生物学'], max: 2 },
    };
    const allSubjects = [...SUBJECTS.primary.options, ...SUBJECTS.secondary.options];

    let selectedSubjects = [];

    function loadSubjectSelection() {
        try {
            const saved = localStorage.getItem('gaokao_subjects');
            if (saved) {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed)) {
                    selectedSubjects = parsed.filter(s => allSubjects.includes(s));
                    return;
                }
            }
        } catch (_) {}
        selectedSubjects = [];
    }

    function saveSubjectSelection() {
        try {
            localStorage.setItem('gaokao_subjects', JSON.stringify(selectedSubjects));
        } catch (_) {}
    }

    function isSubjectSelected(name) {
        return selectedSubjects.includes(name);
    }

    function updateSelectorHint() {
        const hint = document.querySelector('.ss-hint');
        if (!hint) return;
        const count = selectedSubjects.length;
        if (count === 0) {
            hint.textContent = '点击标记你的选科';
        } else {
            hint.textContent = `已选 ${count} 科`;
        }
    }

    function initSubjectSelector() {
        loadSubjectSelection();
        const container = document.getElementById('subjectSelector');
        if (!container) return;

        const options = Array.from(container.querySelectorAll('.ss-option'));
        options.forEach(el => {
            const subject = el.dataset.subject;
            if (isSubjectSelected(subject)) el.classList.add('active');

            el.addEventListener('click', () => {
                const group = SUBJECTS.primary.options.includes(subject) ? 'primary'
                    : SUBJECTS.secondary.options.includes(subject) ? 'secondary' : null;
                if (!group) return;

                const isActive = el.classList.contains('active');

                if (group === 'primary') {
                    // 首选: 互斥单选
                    if (isActive) {
                        el.classList.remove('active');
                        selectedSubjects = selectedSubjects.filter(s => s !== subject);
                    } else {
                        // 清除该组所有选中
                        options.forEach(o => {
                            if (SUBJECTS.primary.options.includes(o.dataset.subject)) {
                                o.classList.remove('active');
                            }
                        });
                        el.classList.add('active');
                        selectedSubjects = selectedSubjects.filter(
                            s => !SUBJECTS.primary.options.includes(s)
                        );
                        selectedSubjects.push(subject);
                    }
                } else {
                    // 再选: 最多选 max 个
                    if (isActive) {
                        el.classList.remove('active');
                        selectedSubjects = selectedSubjects.filter(s => s !== subject);
                    } else {
                        const currentCount = options.filter(o =>
                            SUBJECTS.secondary.options.includes(o.dataset.subject) &&
                            o.classList.contains('active')
                        ).length;
                        if (currentCount >= SUBJECTS.secondary.max) {
                            // 超过上限时闪烁提示
                            el.style.transition = 'none';
                            el.style.borderColor = '#dc3545';
                            el.style.color = '#dc3545';
                            setTimeout(() => {
                                el.style.transition = '';
                                el.style.borderColor = '';
                                el.style.color = '';
                            }, 300);
                            return;
                        }
                        el.classList.add('active');
                        selectedSubjects.push(subject);
                    }
                }

                saveSubjectSelection();
                updateSelectorHint();
                applySubjectHighlight();
            });
        });

        updateSelectorHint();
        applySubjectHighlight();
    }

    function applySubjectHighlight() {
        const cards = document.querySelectorAll('.exam-card');
        cards.forEach(card => {
            card.classList.remove('subject-selected', 'subject-dimmed');
            const oldBadge = card.querySelector('.sel-badge');
            if (oldBadge) oldBadge.remove();

            const nameEl = card.querySelector('.name');
            if (!nameEl) return;
            let cardName = nameEl.textContent.replace(/考试中.*$/, '').trim();

            // 处理 "历史 / 物理" 这种组合科目
            const parts = cardName.split('/').map(s => s.trim()).filter(Boolean);

            const matched = parts.some(p => isSubjectSelected(p));
            const isElective = parts.some(p => allSubjects.includes(p));
            const hasSelection = selectedSubjects.length > 0;

            if (matched) {
                card.classList.add('subject-selected');
                const badge = document.createElement('span');
                badge.className = 'sel-badge';
                badge.textContent = '已选';
                card.querySelector('.countdown-mini').before(badge);
            } else if (isElective && hasSelection) {
                card.classList.add('subject-dimmed');
                const badge = document.createElement('span');
                badge.className = 'sel-badge';
                badge.textContent = '未选';
                card.querySelector('.countdown-mini').before(badge);
            }
        });
    }

    // ============================================================
    //  渲染
    // ============================================================

    function pad2(n) { return String(n).padStart(2, '0'); }

    function render() {
        const root = document.getElementById('scheduleRoot');
        root.innerHTML = '';

        // 按日期分组
        const groups = {};
        exams.forEach(ex => {
            if (!groups[ex.date]) groups[ex.date] = [];
            groups[ex.date].push(ex);
        });

        Object.keys(groups).sort((a, b) => a - b).forEach(dateKey => {
            const dayExams = groups[dateKey];

            // 日期组容器
            const grp = document.createElement('div');
            grp.className = 'day-group';

            const hdr = document.createElement('div');
            hdr.className = 'day-header';
            hdr.innerHTML = `<span class="day-num">${dateKey}</span><span class="day-date">${dateLabels[dateKey]}</span>`;
            grp.appendChild(hdr);

            // 按上下午分组
            let lastSession = '';
            dayExams.forEach(ex => {
                const isAM = ex.start[0] < 12;
                const session = isAM ? '上午' : '下午';

                if (session !== lastSession) {
                    lastSession = session;
                    const div = document.createElement('div');
                    div.className = 'session-divider';
                    div.innerHTML = `<span class="line"></span><span class="label">${session}场</span><span class="line"></span>`;
                    grp.appendChild(div);
                }
                const card = document.createElement('div');
                card.className = 'exam-card';
                card.id = `card-${ex.date}-${ex.name.replace(/[\/\s]/g,'')}`;

                const startH = pad2(ex.start[0]), startM = pad2(ex.start[1]);
                const endH = pad2(ex.end[0]), endM = pad2(ex.end[1]);
                const durationMin = (ex.end[0]*60+ex.end[1]) - (ex.start[0]*60+ex.start[1]);
                const durStr = durationMin >= 60
                    ? `${Math.floor(durationMin/60)}时${durationMin%60 ? durationMin%60+'分' : ''}`
                    : `${durationMin}分钟`;

                card.innerHTML = `
                    <span class="name">${ex.name}</span>
                    <span class="meta">
                        <span class="time-range">${startH}:${startM} – ${endH}:${endM}</span>
                        <span class="tag ${tagClasses[ex.tag]}">${tagLabels[ex.tag]}</span>
                        <span style="color:#bbb;font-size:0.72rem;">${durStr}</span>
                    </span>
                    <span class="countdown-mini" id="cd-${ex.date}-${ex.name.replace(/[\/\s]/g,'')}">
                        <span class="cd-num" id="cd-d-${ex.date}-${ex.name.replace(/[\/\s]/g,'')}">--</span><span class="cd-unit">天</span>
                        <span class="cd-sep">·</span>
                        <span class="cd-num" id="cd-h-${ex.date}-${ex.name.replace(/[\/\s]/g,'')}">--</span><span class="cd-unit">时</span>
                        <span class="cd-sep">·</span>
                        <span class="cd-num" id="cd-m-${ex.date}-${ex.name.replace(/[\/\s]/g,'')}">--</span><span class="cd-unit">分</span>
                        <span class="cd-sep">·</span>
                        <span class="cd-num" id="cd-s-${ex.date}-${ex.name.replace(/[\/\s]/g,'')}">--</span><span class="cd-unit">秒</span>
                    </span>
                `;

                grp.appendChild(card);
            });

            root.appendChild(grp);
        });

        // 提示标签
        const hint = document.createElement('div');
        hint.className = 'cd-legend';
        hint.textContent = '距开考倒计时';
        root.appendChild(hint);
    }

    render();
    initSubjectSelector();

    // ============================================================
    //  更新所有倒计时
    // ============================================================

    function updateAll() {
        const now = new Date();

        // --- 总体倒计时 ---
        const gaokaoStart = new Date(GAOKAO_YEAR, 5, 7, 0, 0, 0);
        const gaokaoEnd   = new Date(GAOKAO_YEAR, 5, 10, 11, 0, 0); // 最后一科结束
        const heroSection = document.getElementById('heroSection');
        const heroLabel   = document.getElementById('heroLabel');
        const statusMsg   = document.getElementById('statusMsg');
        const yearBadge   = document.getElementById('yearBadge');

        yearBadge.textContent = GAOKAO_YEAR;

        if (now >= gaokaoStart && now <= gaokaoEnd) {
            // 高考进行中
            const diff = gaokaoEnd - now;
            setHero(diff, '距全部结束还有');
            heroSection.classList.add('ongoing');
            statusMsg.classList.add('show');
        } else if (now < gaokaoStart) {
            // 高考尚未开始
            const diff = gaokaoStart - now;
            setHero(diff, `距 ${GAOKAO_YEAR} 年高考还有`);
            heroSection.classList.remove('ongoing');
            statusMsg.classList.remove('show');
        } else {
            // 高考已结束
            const nextStart = new Date(GAOKAO_YEAR + 1, 5, 7, 0, 0, 0);
            const diff = nextStart - now;
            setHero(diff, `距 ${GAOKAO_YEAR + 1} 年高考还有`);
            heroSection.classList.remove('ongoing');
            statusMsg.classList.remove('show');
        }

        // --- 每科倒计时 ---
        exams.forEach(ex => {
            const start = getExamStart(ex);
            const end   = getExamEnd(ex);
            const key = `${ex.date}-${ex.name.replace(/[\/\s]/g,'')}`;
            const card = document.getElementById(`card-${key}`);

            const dEl = document.getElementById(`cd-d-${key}`);
            const hEl = document.getElementById(`cd-h-${key}`);
            const mEl = document.getElementById(`cd-m-${key}`);
            const sEl = document.getElementById(`cd-s-${key}`);

            if (!dEl) return;

            // 清除状态
            card.classList.remove('exam-now', 'exam-done');
            const oldBadge = card.querySelector('.exam-done-badge');
            if (oldBadge) oldBadge.remove();

            if (now < start) {
                // 尚未开始 → 倒计时
                const diff = start - now;
                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff % 86400000) / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                dEl.textContent = pad2(d);
                hEl.textContent = pad2(h);
                mEl.textContent = pad2(m);
                sEl.textContent = pad2(s);
            } else if (now >= start && now <= end) {
                // 正在考试
                card.classList.add('exam-now');
                const diff = end - now;
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                dEl.textContent = '00';
                hEl.textContent = pad2(h);
                mEl.textContent = pad2(m);
                sEl.textContent = pad2(s);

                // 在科目名后加"考试中"徽章
                let badge = card.querySelector('.exam-badge');
                if (!badge) {
                    badge = document.createElement('span');
                    badge.className = 'exam-badge';
                    badge.textContent = '考试中';
                    card.querySelector('.name').appendChild(badge);
                }
            } else {
                // 已结束
                card.classList.add('exam-done');
                dEl.textContent = '';
                hEl.textContent = '';
                mEl.textContent = '';
                sEl.textContent = '';
                // 显示"已完成"徽章
                let doneBadge = card.querySelector('.exam-done-badge');
                if (!doneBadge) {
                    doneBadge = document.createElement('span');
                    doneBadge.className = 'exam-done-badge';
                    doneBadge.textContent = '已完成';
                    card.querySelector('.countdown-mini').appendChild(doneBadge);
                }
                // 清除"考试中" badge
                const badge = card.querySelector('.exam-badge');
                if (badge) badge.remove();
            }
        });

        // 应用选科高亮
        applySubjectHighlight();

        // --- 当前考试进程状态 ---
        const ceEl = document.getElementById('currentExam');
        const ceLabel = document.getElementById('ceLabel');
        const ceBadge = document.getElementById('ceBadge');
        const ceName = document.getElementById('ceName');
        const ceTime = document.getElementById('ceTime');
        const ceCountdown = document.getElementById('ceCountdown');
        const ceFill = document.getElementById('ceProgressFill');
        const ceStart = document.getElementById('ceProgressStart');
        const ceEnd = document.getElementById('ceProgressEnd');

        // 找到当前/下一场/上一场考试（考虑选科）
        let current = null, next = null, lastDone = null;
        for (const ex of exams) {
            if (selectedSubjects.length > 0 && !isExamRelevant(ex)) continue;
            const s = getExamStart(ex);
            const e = getExamEnd(ex);
            if (now >= s && now <= e) { current = ex; break; }
            if (now < s && !next) next = ex;
            if (now > e) lastDone = ex;
        }

        if (current) {
            // 当前有考试
            const s = getExamStart(current);
            const e = getExamEnd(current);
            const total = e - s;
            const elapsed = now - s;
            const remain = e - now;
            const pct = Math.min(100, Math.max(0, (elapsed / total) * 100));

            ceEl.classList.remove('ce-waiting');
            ceEl.classList.add('show');
            const sh = pad2(current.start[0]), sm = pad2(current.start[1]);
            const eh = pad2(current.end[0]), em = pad2(current.end[1]);
            ceLabel.textContent = '当前考试';
            ceBadge.textContent = '进行中';
            ceBadge.className = 'ce-status-badge ce-ongoing';
            ceName.textContent = current.name;
            ceTime.textContent = `${sh}:${sm} ~ ${eh}:${em}`;
            const rh = Math.floor(remain / 3600000);
            const rm = Math.floor((remain % 3600000) / 60000);
            const rs = Math.floor((remain % 60000) / 1000);
            ceCountdown.textContent = `${pad2(rh)}:${pad2(rm)}:${pad2(rs)}`;
            ceFill.style.width = `${pct}%`;
            ceStart.textContent = '开始';
            ceEnd.textContent = '剩余 ' + ceCountdown.textContent;
        } else if (next) {
            // 下一场考试
            const s = getExamStart(next);
            const diff = s - now;
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff % 86400000) / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s_ = Math.floor((diff % 60000) / 1000);

            ceEl.classList.add('show');
            const sh = pad2(next.start[0]), sm = pad2(next.start[1]);
            const eh = pad2(next.end[0]), em = pad2(next.end[1]);
            ceLabel.textContent = '下一场';
            ceBadge.textContent = '即将开始';
            ceBadge.className = 'ce-status-badge ce-upcoming';
            ceName.textContent = next.name;
            ceTime.textContent = `${sh}:${sm} ~ ${eh}:${em}`;
            ceCountdown.textContent = d > 0
                ? `${d}天 ${pad2(h)}:${pad2(m)}:${pad2(s_)}`
                : `${pad2(h)}:${pad2(m)}:${pad2(s_)}`;
            ceFill.style.width = '0%';
            ceStart.textContent = '距离开考';
            ceEnd.textContent = ceCountdown.textContent;
            ceEl.classList.add('ce-waiting');
        } else if (lastDone) {
            // 全部结束
            ceEl.classList.add('show');
            ceLabel.textContent = '高考进程';
            ceBadge.textContent = '已全部完成';
            ceBadge.className = 'ce-status-badge ce-done';
            ceName.textContent = '所有考试已结束';
            ceTime.textContent = '—';
            ceCountdown.textContent = '—';
            ceFill.style.width = '100%';
            ceStart.textContent = '全部完成';
            ceEnd.textContent = '金榜题名';
            ceEl.classList.remove('ce-waiting');
        } else {
            ceEl.classList.remove('show', 'ce-waiting');
        }
    }

    function setHero(diff, label) {
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);

        document.getElementById('hDays').textContent   = pad2(d);
        document.getElementById('hHours').textContent  = pad2(h);
        document.getElementById('hMins').textContent   = pad2(m);
        document.getElementById('hSecs').textContent   = pad2(s);
        document.getElementById('heroLabel').textContent = label;
    }

    updateAll();
    setInterval(updateAll, 1000);

    const themeToggle = document.getElementById('themeToggle');

    function loadTheme() {
        try {
            const saved = localStorage.getItem('gaokao_theme');
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '深色';
                return;
            }
        } catch (_) {}
        document.documentElement.removeAttribute('data-theme');
        themeToggle.textContent = '浅色';
    }

    function toggleTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
            document.documentElement.removeAttribute('data-theme');
            themeToggle.textContent = '浅色';
            try { localStorage.setItem('gaokao_theme', 'light'); } catch (_) {}
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.textContent = '深色';
            try { localStorage.setItem('gaokao_theme', 'dark'); } catch (_) {}
        }
        // 全屏打开时同步更新
        if (fsOverlay.classList.contains('open')) updateFullscreen();
    }

    const pipBtn = document.getElementById('pipToggle');

    function buildPipContent(doc, winW, winH) {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const bg = isDark ? '#1c1814' : '#f8f4ee';
        const cardBg = isDark ? '#2a2420' : '#ffffff';
        const textMain = isDark ? '#e8e0d8' : '#3a3228';

        const baseSize = Math.max(8, Math.min(winW, winH * 1.8) / 22);

        doc.write(`

    function updatePipContent() {
        if (!pipWindow || pipWindow.closed) return;
        const doc = pipWindow.document;
        const now = new Date();

        const gaokaoStart = new Date(GAOKAO_YEAR, 5, 7, 0, 0, 0);
        const gaokaoEnd = new Date(GAOKAO_YEAR, 5, 10, 11, 0, 0);
        let diff, label;
        if (now >= gaokaoStart && now <= gaokaoEnd) {
            diff = gaokaoEnd - now;
            label = '距全部结束还有';
        } else if (now < gaokaoStart) {
            diff = gaokaoStart - now;
            label = `距 ${GAOKAO_YEAR} 年高考还有`;
        } else {
            const nextStart = new Date(GAOKAO_YEAR + 1, 5, 7, 0, 0, 0);
            diff = nextStart - now;
            label = `距 ${GAOKAO_YEAR + 1} 年高考还有`;
        }

        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);

        const elLabel = doc.getElementById('pipLabel');
        const elD = doc.getElementById('pipD');
        const elH = doc.getElementById('pipH');
        const elM = doc.getElementById('pipM');
        const elS = doc.getElementById('pipS');
        if (elLabel) elLabel.textContent = label;
        if (elD) elD.textContent = pad2(d);
        if (elH) elH.textContent = pad2(h);
        if (elM) elM.textContent = pad2(m);
        if (elS) elS.textContent = pad2(s);

        // 下一场
        let nextName = '—', nextTime = '—';
        for (const ex of exams) {
            if (selectedSubjects.length > 0 && !isExamRelevant(ex)) continue;
            const s = getExamStart(ex);
            if (now < s) {
                nextName = ex.name;
                const diff2 = s - now;
                const d2 = Math.floor(diff2 / 86400000);
                const h2 = Math.floor((diff2 % 86400000) / 3600000);
                const m2 = Math.floor((diff2 % 3600000) / 60000);
                nextTime = d2 > 0 ? `${d2}天` : `${pad2(h2)}:${pad2(m2)}`;
                break;
            }
        }
        const elNext = doc.getElementById('pipNext');
        const elNextTime = doc.getElementById('pipNextTime');
        if (elNext) elNext.textContent = nextName;
        if (elNextTime) elNextTime.textContent = nextTime;
    }

        try {
            const pipW = 360, pipH = 210;
            pipWindow = await window.documentPictureInPicture.requestWindow({
                width: pipW,
                height: pipH,
            });
            pipBtn.textContent = '关闭';
            pipWindow.document.title = '高考倒计时';
            buildPipContent(pipWindow.document, pipW, pipH);
            updatePipContent();
            pipInterval = setInterval(updatePipContent, 1000);

            pipWindow.addEventListener('pagehide', () => {
                clearInterval(pipInterval);
                pipWindow = null;
                pipInterval = null;
                pipBtn.textContent = '小窗';

    const fsOverlay = document.getElementById('fsOverlay');
    const fsToggle  = document.getElementById('fsToggle');
    const fsExit    = document.getElementById('fsExit');

    function isExamRelevant(ex) {
        if (selectedSubjects.length === 0) return true;
        if (ex.tag !== 'elective') return true;
        const parts = ex.name.split('/').map(s => s.trim());
        return parts.some(p => selectedSubjects.includes(p));
    }

    function updateFullscreen() {
        const now = new Date();
        const fsInner = document.querySelector('.fs-inner');

        // 判断当前是否有考试在进行（仅相关科目）
        let hasCurrent = false, curExam = null;
        for (const ex of exams) {
            if (!isExamRelevant(ex)) continue;
            const s = getExamStart(ex), e = getExamEnd(ex);
            if (now >= s && now <= e) { hasCurrent = true; curExam = ex; break; }
        }

        const allDone = exams.every(ex => now > getExamEnd(ex));

        // 切换等待/进行中状态样式（全部结束时保持默认）
        fsInner.classList.toggle('fs-state-waiting', !hasCurrent && !allDone);

        // 状态条
        const fsStatusBar = document.getElementById('fsStatusBar');
        const fsStatusText = document.getElementById('fsStatusText');
        fsStatusBar.className = 'fs-status-bar';
        if (hasCurrent) {
            fsStatusBar.classList.add('status-ongoing');
            fsStatusText.textContent = '正在进行';
        } else if (allDone) {
            fsStatusBar.classList.add('status-done');
            fsStatusText.textContent = '已全部完成';
        } else {
            fsStatusBar.classList.add('status-waiting');
            fsStatusText.textContent = '等待开考';
        }

        const ceEl = document.getElementById('currentExam');
        const isVisible = ceEl.classList.contains('show');

        // 当前考试信息
        const curName  = document.getElementById('ceName').textContent;
        const curTime  = document.getElementById('ceTime').textContent;
        const progFill = document.getElementById('ceProgressFill').style.width || '0%';
        const progEnd  = document.getElementById('ceProgressEnd').textContent;

        document.getElementById('fsCurName').textContent  = curName !== '—' ? curName : '暂无考试';
        document.getElementById('fsCurTime').textContent  = curTime;
        document.getElementById('fsProgressFill').style.width = progFill;
        document.getElementById('fsProgEnd').textContent  = progEnd;

        document.getElementById('fsCurLabel').textContent =
            hasCurrent ? '当前考试' : (isVisible ? '下一场' : '高考进程');

        // 更新数字块计时器
        const fsDd = document.getElementById('fsDd');
        const fsDh = document.getElementById('fsDh');
        const fsDm = document.getElementById('fsDm');
        const fsDs = document.getElementById('fsDs');

        let targetEnd = null;
        for (const ex of exams) {
            if (!isExamRelevant(ex)) continue;
            const s = getExamStart(ex), e = getExamEnd(ex);
            if (now >= s && now <= e) { targetEnd = e; break; }
            if (now < s && !targetEnd) { targetEnd = s; break; }
        }
        if (targetEnd) {
            const diff = Math.max(0, targetEnd - now);
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff % 86400000) / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            fsDd.textContent = pad2(d);
            fsDh.textContent = pad2(h);
            fsDm.textContent = pad2(m);
            fsDs.textContent = pad2(s);
        } else {
            fsDd.textContent = '—'; fsDh.textContent = '—';
            fsDm.textContent = '—'; fsDs.textContent = '—';
        }

        // 下一场（仅相关科目）
        let nextName = '—', nextTime = '—', nextCountdown = '—';
        for (const ex of exams) {
            if (!isExamRelevant(ex)) continue;
            const s = getExamStart(ex);
            if (now < s) {
                nextName = ex.name;
                const sh = pad2(ex.start[0]), sm = pad2(ex.start[1]);
                const eh = pad2(ex.end[0]), em = pad2(ex.end[1]);
                nextTime = `${sh}:${sm} ~ ${eh}:${em}`;
                const diff = s - now;
                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff % 86400000) / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s_ = Math.floor((diff % 60000) / 1000);
                nextCountdown = d > 0
                    ? `${d}天 ${pad2(h)}:${pad2(m)}:${pad2(s_)}`
                    : `${pad2(h)}:${pad2(m)}:${pad2(s_)}`;
                break;
            }
        }

        if (allDone) {
            document.getElementById('fsNext').style.display = 'none';
        } else {
            document.getElementById('fsNext').style.display = 'flex';
            document.getElementById('fsNextName').textContent      = nextName;
            document.getElementById('fsNextTime').textContent      = nextTime;
            document.getElementById('fsNextCountdown').textContent = nextCountdown;
        }

        // 进度统计（仅相关科目）
        const relevantExams = exams.filter(ex => isExamRelevant(ex));
        let doneCount = 0;
        relevantExams.forEach(ex => { if (now > getExamEnd(ex)) doneCount++; });
        document.getElementById('fsDone').textContent   = doneCount;
        document.getElementById('fsRemain').textContent = relevantExams.length - doneCount;
        const fsHint = document.getElementById('fsTotalHint');
        if (fsHint) {
            fsHint.textContent = selectedSubjects.length > 0
                ? '· 已选科'
                : '· 全部科目';
        }
    }

    function lockScroll(lock) {
        document.documentElement.style.overflow = lock ? 'hidden' : '';
        document.body.style.overflow = lock ? 'hidden' : '';
    }

    fsToggle.addEventListener('click', () => {
        fsOverlay.classList.add('open');
        lockScroll(true);
        updateFullscreen();
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
        }
    });

    fsExit.addEventListener('click', () => {
        fsOverlay.classList.remove('open');
        lockScroll(false);
        if (document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
        }
    });

    // ESC 或 F11 退出时同步关闭
    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
            fsOverlay.classList.remove('open');
            lockScroll(false);
        }
    });

    // 全屏时也同步更新
    setInterval(() => {
        if (fsOverlay.classList.contains('open')) updateFullscreen();
    }, 1000);
</script>

<script>
    // Service Worker 注册（需要 HTTPS 或 localhost）
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(() => {
                // file:// 或老旧浏览器会失败，静默处理
            });
        });
    }
</script>
